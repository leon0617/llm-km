services:
  frontend:
    build: ./frontend
    container_name: llm-km-frontend-1
    environment:
      - NEXT_PUBLIC_API_BASE=/api
      - INTERNAL_API_BASE=http://backend:8000/api
      - HOSTNAME=0.0.0.0
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - default
      - nginx-network

  backend:
    build: ./backend
    container_name: llm-km-backend-1
    env_file: .env
    environment:
      - WIKI_DATA_DIR=/data
      - CORS_ORIGINS=https://leonl-km.lbest.online
      - OCR_SERVICE_URL=http://smartledger-paddleocr:8000
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - default
      - nginx-network

networks:
  default:
  nginx-network:
    external: true
    name: nginx_nginx-network
